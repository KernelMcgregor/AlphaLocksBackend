name: Articles (newsroom)

# Researched articles for the top of each card (app/services/ufc/newsroom). Nightly after
# the 06:00 post-event update, so tonight's predictions and odds are in. Cheap when nothing
# happened: the news search is free, stories already read are not re-read, and an article
# is rewritten only when the pick changed or new reporting arrived. Spend is capped by
# NEWSROOM_MONTHLY_BUDGET_USD (ufc_newsroom_spend).
#
# Fights below the top five keep the single-call previews from the Railway Full Pipeline.
on:
  schedule:
    - cron: '40 7 * * *'
    # Fight week: a second pass in the evening, when press-conference coverage lands.
    - cron: '40 19 * * 3,4,5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Cards this many days ahead'
        default: '10'
      force:
        description: 'Rewrite even when nothing changed'
        type: boolean
        default: false

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # The newsroom reads the stats the previews read; no model stack (torch, catboost).
      - name: Install dependencies
        run: >-
          pip install "sqlalchemy>=2.0,<2.1" psycopg2-binary pydantic pydantic-settings
          python-dotenv requests httpx beautifulsoup4 numpy pandas "openai>=1.30.0"
          trafilatura googlenewsdecoder

      - name: Open audit-log entry
        id: audit
        run: >-
          echo "id=$(python -m app.services.audit start --action 'Newsroom Articles' --source github
          --actor '${{ github.actor }}'
          --url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Research and write articles
        run: >-
          python -m app.services.ufc.newsroom --ensure-schema --upcoming
          --days '${{ github.event.inputs.days || '10' }}'
          ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Close audit-log entry
        if: always() && steps.audit.outputs.id != ''
        run: python -m app.services.audit finish --id '${{ steps.audit.outputs.id }}' --status '${{ job.status }}'
