name: Post-Event Update

on:
  schedule:
    # Run daily at 6am UTC (1am EST / 10pm PST)
    - cron: '0 6 * * *'
    # Fight-day odds snapshot (Sat 21:00 UTC, before US prelims). The forward test's
    # closing line comes from the last capture before the event; without this the
    # "close" was Friday 06:00 UTC, a day and a half early.
    - cron: '0 21 * * 6'
  workflow_dispatch: # Allow manual trigger

# The picks job commits picks_log.jsonl back to the repo, so it needs write access.
permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    # Not on the fight-day cron: mid-event, "recent event missing results" is true.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Any card in the last week that still has fights without a result, not just
      # yesterday's. Checking only yesterday meant one failed night stranded a card for
      # good: UFC Fight Night on 2026-09-26 missed its results when this job crashed on
      # the 27th, and on the 28th "yesterday" no longer matched it.
      - name: Check for a recent event missing results
        id: check
        run: |
          python -c "
          from app.database import SessionLocal
          from app.models.ufc import UFCEvent, UFCFight
          from datetime import date, timedelta

          db = SessionLocal()
          today = date.today()
          # A finished bout always has a method; draws and no-contests have no winner.
          event = (
              db.query(UFCEvent)
              .join(UFCFight, UFCFight.event_id == UFCEvent.id)
              .filter(UFCEvent.date < today, UFCEvent.date >= today - timedelta(days=7),
                      UFCFight.method.is_(None))
              .order_by(UFCEvent.date.desc())
              .first()
          )
          db.close()

          if event:
              print(f'Missing results: {event.name} on {event.date}')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('event_happened=true\n')
          else:
              print('No recent event is missing results')
              with open('$GITHUB_OUTPUT', 'a') as f:
                  f.write('event_happened=false\n')
          "

      # Audit log (admin dashboard). Only when there is work, so quiet nights add no rows.
      # Prints nothing if the write fails, which turns the closing step into a no-op
      # rather than failing the workflow over bookkeeping.
      - name: Open audit-log entry
        id: audit
        if: steps.check.outputs.event_happened == 'true'
        run: >-
          echo "id=$(python -m app.services.audit start --action 'Post-Event Update' --source github
          --actor '${{ github.actor }}'
          --url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Run post-event scrape (results + upcoming)
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.scraper --recent

      # The stats chain, in dependency order. Neither of the next two steps used to run
      # here: compute_all_derived_stats fired only from the FULL scrape (never from
      # --recent), and compute_all_career_stats had no automated call site at all. So
      # last night's fight had empty derived columns and every career aggregate was as
      # stale as the last manual run, and rankings below were computed on top of that.
      # Newly booked fighters (debutants, short-notice replacements) get their full pro
      # record from Sherdog, plus their regional opponents' records. Budgeted at ~10 min;
      # anything left over carries to the next run. Before features are built.
      - name: Sherdog records for newly booked fighters
        if: steps.check.outputs.event_happened == 'true'
        continue-on-error: true
        run: python -m app.services.ufc.external_records --sync-debutants --max-requests 300

      - name: Compute derived fight stats
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.fight_stats_derived_service

      - name: Compute career stats
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.career_stats_service

      # Must precede the two prediction steps. ufcstats drops a cancelled or rebooked bout from
      # its event page, but upsert_fight only ever inserts or updates, so the bout survives in our
      # copy forever — Noche UFC stored 16 fights against a real card of 13, with Jean Silva
      # appearing twice. Without this the models below generate predictions for bouts that will
      # never happen, and those bouts stay on the upcoming-events page.
      #
      # --no-previews here because this job's own preview pass covers the replacement bout; the
      # standalone reconcile job below is the one that needs to fill that gap itself.
      - name: Remove cancelled fights
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.reconcile_service --apply --no-previews

      # Must precede the prediction steps: ranking_service rewrites ufc_glicko_snapshots,
      # which serving reads. Run after, last night's fighters had no snapshot for their
      # newest bout and the model saw zero-filled Glicko features.
      - name: Generate fighter rankings
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.ranking_service

      - name: Generate winner predictions
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.model --predict

      - name: Generate method predictions
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.method_model --predict

      # Reads career stats and the Glicko profiles, so it runs last. No --refit: the
      # embedding space stays frozen so scores remain comparable across events and
      # previous_rank measures fighters moving, not the basis moving.
      - name: Generate style similarity
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.style_service

      # Debuting fighters arrive from ufcstats with a bare record: no photo, flag or bio.
      # Fills those from ufc.com for anyone recent or booked who is still missing them,
      # then caches the photos. Skips fields locked in the admin dashboard.
      - name: Fighter profiles and photos
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.ufc_profile_scraper --recent-days 60

      - name: Scrape live odds
        if: steps.check.outputs.event_happened == 'true'
        run: python -m app.services.ufc.odds_scraper --live

      # Results for last night's card are now in the DB, so any picks on it can be
      # graded. --settle only ever fills in `result` and `profit` on entries that are
      # still open; it cannot alter a pick or add one.
      - name: Settle picks from last night's card
        if: steps.check.outputs.event_happened == 'true'
        run: python -m scripts.generate_picks --settle

      # v2.0 forward test (PREREGISTRATION_V2.md): settle last night's rows with results
      # and closing lines, then log newly priced fights against the fresh odds. v1.2 is
      # retired, so the step above only settles its open picks and none are added.
      - name: Forward test - settle and log
        if: steps.check.outputs.event_happened == 'true'
        run: python -m scripts.forward_track --settle --log

      - name: Commit picks log
        if: steps.check.outputs.event_happened == 'true'
        uses: ./.github/actions/commit-picks

      - name: Summary
        if: steps.check.outputs.event_happened == 'true'
        run: echo "Post-event update complete - scraped results, refreshed upcoming, generated predictions, rankings, fetched odds, settled and logged picks"

      - name: Close audit-log entry
        if: always() && steps.audit.outputs.id != ''
        run: python -m app.services.audit finish --id '${{ steps.audit.outputs.id }}' --status '${{ job.status }}'

  # Also refresh odds twice a week regardless of events
  refresh-odds:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if today is odds refresh day (Tue/Fri)
        id: odds_check
        run: |
          python -c "
          from datetime import date
          day = date.today().weekday()
          # 1=Tuesday, 4=Friday
          should_refresh = day in (1, 4)
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'refresh={str(should_refresh).lower()}\n')
          print(f'Day={day}, refresh={should_refresh}')
          "

      - name: Open audit-log entry
        id: audit
        if: steps.odds_check.outputs.refresh == 'true'
        run: >-
          echo "id=$(python -m app.services.audit start --action 'Odds Refresh' --source github
          --actor '${{ github.actor }}'
          --url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Refresh odds
        if: steps.odds_check.outputs.refresh == 'true'
        run: python -m app.services.ufc.odds_scraper --live

      # Bookings are announced any day, so debutants are looked up on the odds cadence
      # too, not only after events.
      - name: Sherdog records for newly booked fighters
        if: steps.odds_check.outputs.refresh == 'true'
        continue-on-error: true
        run: python -m app.services.ufc.external_records --sync-debutants --max-requests 300

      # Picks are logged on the SAME cadence as the odds they are priced against.
      # Decoupling the two would mean picking against a line that has since moved, and
      # the pre-registered rule keys off the market price at pick time.
      #
      # A missed card is evidence permanently lost: the rule needs ~150 settled picks to
      # reach a verdict at roughly 70/year, so the sample is the binding constraint on
      # this whole experiment. Automating it is what stops that sample leaking.
      - name: Forward test - log newly priced fights
        if: steps.odds_check.outputs.refresh == 'true'
        run: python -m scripts.forward_track --log

      - name: Commit picks log
        if: steps.odds_check.outputs.refresh == 'true'
        uses: ./.github/actions/commit-picks

      - name: Close audit-log entry
        if: always() && steps.audit.outputs.id != ''
        run: python -m app.services.audit finish --id '${{ steps.audit.outputs.id }}' --status '${{ job.status }}'

  # Fight-day snapshot so the forward test has a real closing line. Odds only.
  closing-odds:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 21 * * 6'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snapshot odds
        run: python -m app.services.ufc.odds_scraper --live
