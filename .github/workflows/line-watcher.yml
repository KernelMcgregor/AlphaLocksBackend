name: Line Watcher

# Every two hours: record new opening lines from BestFightOdds, look up newly booked
# fighters on Sherdog, and (only when something changed) refresh predictions and log the
# forward test at the opening price. See app/services/ufc/line_watcher.py and
# PREREGISTRATION_V2.md (v2.1).
#
# Off the hour on purpose: GitHub delays top-of-the-hour schedules the most.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commits forward_log_v2.jsonl

# Never run alongside the nightly pipeline: both write predictions and the forward log.
concurrency:
  group: ufc-pipeline
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Just what the scrapers need. The model stack (torch, catboost, shap) is only
      # installed below when predictions actually have to be refreshed.
      - name: Install light dependencies
        run: >-
          pip install "sqlalchemy>=2.0,<2.1" psycopg2-binary pydantic pydantic-settings
          python-dotenv requests httpx beautifulsoup4 numpy

      # Audit log (admin Schedule page). Every run, unlike the nightly jobs: for a job that
      # should fire every two hours, "when did it last run" is the health signal.
      - name: Open audit-log entry
        id: audit
        run: >-
          echo "id=$(python -m app.services.audit start --action 'Line Watcher' --source github
          --actor '${{ github.actor }}'
          --url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          2>/dev/null)" >> "$GITHUB_OUTPUT"

      # New bookings only reach ufc_fights through a ufcstats scrape; without this the
      # watcher cannot match a bout whose line opens between weekly post-event runs.
      # Every third run (~6 hourly), which is plenty for announcements.
      - name: Is this a bookings refresh run?
        id: slot
        run: |
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((10#$h % 6)) -eq 0 ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh upcoming bookings (ufcstats)
        if: steps.slot.outputs.refresh == 'true'
        run: python -m app.services.ufc.scraper --upcoming

      # Records every pulled bout in ufc_cancelled_bouts before deleting it.
      - name: Remove (and record) cancelled bouts
        if: steps.slot.outputs.refresh == 'true'
        run: python -m app.services.ufc.reconcile_service --apply --no-previews

      - name: Record new opening lines (BestFightOdds)
        id: watch
        run: python -m app.services.ufc.line_watcher

      # Every market FanDuel, Bovada, BetRivers and Pinnacle list (round, method x round,
      # strikes, takedowns...), read from the books directly into ufc_book_market_history.
      # ~110 requests, about 3 minutes. Non-blocking: a book that refuses GitHub's runners
      # (FanDuel serves per US state) must not stop the watcher.
      - name: Record sportsbook markets (FanDuel, Bovada, BetRivers, Pinnacle)
        continue-on-error: true
        run: python -m app.services.ufc.book_markets

      - name: Sherdog records for new fighters
        if: steps.watch.outputs.unlinked != '0' && steps.watch.outputs.unlinked != ''
        continue-on-error: true
        run: python -m app.services.ufc.external_records --sync-debutants --max-requests 100

      # ---- Only when a fight was priced for the first time ----

      - name: Install model dependencies
        if: steps.watch.outputs.changed == 'true'
        run: pip install -r requirements.txt

      # New upcoming bouts need Glicko snapshots, or their Glicko features are zero-filled.
      - name: Refresh Glicko snapshots
        if: steps.watch.outputs.changed == 'true'
        run: python -m app.services.ufc.ranking_service

      - name: Refresh winner predictions
        if: steps.watch.outputs.changed == 'true'
        run: python -m app.services.ufc.model --predict

      - name: Refresh method predictions
        if: steps.watch.outputs.changed == 'true'
        run: python -m app.services.ufc.method_model --predict

      - name: Forward test - log fights at their opening line
        if: steps.watch.outputs.changed == 'true'
        run: python -m scripts.forward_track --log

      # Method forward test: logs each fight once, the first run its prop prices are seen
      # (or the day before the card without them). Runs every time, not only when a new
      # moneyline appeared, because props usually post after the moneyline.
      - name: Method forward test - log fights at their opening prop line
        run: python -m scripts.method_forward_track --log

      - name: Commit forward logs
        uses: ./.github/actions/commit-picks

      - name: Close audit-log entry
        if: always() && steps.audit.outputs.id != ''
        run: python -m app.services.audit finish --id '${{ steps.audit.outputs.id }}' --status '${{ job.status }}'
