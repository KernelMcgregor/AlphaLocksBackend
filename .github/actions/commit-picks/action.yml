name: Commit picks log
description: >
  Commit picks_log.jsonl back to the repository. A CI runner is ephemeral, so a pick
  written during a workflow and not committed is simply lost -- and the git timestamp is
  the entire evidentiary value of the log, since it is what proves a pick predates the
  fight it was made on.

runs:
  using: composite
  steps:
    - name: Commit and push picks log
      shell: bash
      run: |
        set -euo pipefail

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # The generator is append-only and skips fights already logged, so on most runs
        # there is nothing new. That is the normal case, not a failure.
        if git diff --quiet -- picks_log.jsonl; then
          echo "No new picks to commit."
          exit 0
        fi

        added=$(git diff --numstat -- picks_log.jsonl | awk '{print $1}')
        removed=$(git diff --numstat -- picks_log.jsonl | awk '{print $2}')

        # An append-only log must only ever grow. A run that deletes or rewrites lines
        # means something is wrong -- a settle pass gone bad, a stale checkout, a
        # regenerated file -- and silently pushing it would destroy the audit trail the
        # experiment depends on. Settlement rewrites lines in place, so removals are
        # expected only when they are matched one-for-one by additions.
        if [ "${removed:-0}" -gt 0 ] && [ "${removed:-0}" -ne "${added:-0}" ]; then
          echo "::error::picks_log.jsonl lost ${removed} line(s) against ${added} added."
          echo "An append-only log must not shrink. Refusing to push; inspect manually."
          git diff -- picks_log.jsonl
          exit 1
        fi

        git add picks_log.jsonl
        git commit -m "Log picks ($(date -u +%Y-%m-%d): +${added:-0}/-${removed:-0} lines)"

        # Both jobs in this workflow can commit on the same morning, and they run
        # concurrently. Rebase onto whatever landed first rather than failing or, worse,
        # force-pushing over another job's picks.
        for attempt in 1 2 3; do
          if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
             git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Pushed picks log on attempt ${attempt}."
            exit 0
          fi
          echo "Push attempt ${attempt} failed; retrying."
          sleep $(( attempt * 5 ))
        done

        echo "::error::Could not push picks log after 3 attempts."
        exit 1
